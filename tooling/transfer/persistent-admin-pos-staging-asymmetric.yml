name: Persistent Admin POS Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/admin-web/**"
      - "apps/pos-web/**"
      - "apps/api/**"
      - "packages/foundation/**"
      - "packages/ui/**"
      - "modules/**"
      - "database/**"
      - "tests/unit/persistent-admin-pos-staging.test.mjs"
      - "tests/unit/staging-operability.test.mjs"
      - "tests/unit/staging-outbox-publisher.test.mjs"
      - "tests/unit/staging-operational-release.test.mjs"
      - "tests/unit/staging-auth-origin.test.mjs"
      - "tests/unit/staging-read-context.test.mjs"
      - "tests/unit/staging-mfa.test.mjs"
      - "tests/unit/staging-command-token.test.mjs"
      - "tests/unit/staging-asymmetric-token.test.mjs"
      - "tests/unit/staging-asymmetric-deployment.test.mjs"
      - "tests/helpers/staging-token-keyset.mjs"
      - "tests/unit/staging-account-recovery.test.mjs"
      - "tooling/scripts/apply-migrations.mjs"
      - "tooling/scripts/deploy-custom-auth-staging.mjs"
      - "tooling/scripts/run-custom-auth-staging.mjs"
      - "tooling/scripts/staging-custom-auth-patch.mjs"
      - "tooling/scripts/staging-token-keyset.mjs"
      - "tooling/scripts/staging-mfa-reservation-evidence.mjs"
      - "tooling/scripts/staging-account-recovery-evidence.mjs"
      - "tooling/scripts/run-operational-staging.mjs"
      - "tooling/scripts/staging-operability.mjs"
      - "tooling/scripts/staging-outbox-publisher.mjs"
      - "tooling/scripts/staging-operational-runner.mjs"
      - "docs/architecture/staging/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/persistent-admin-pos-staging.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/admin-web/**"
      - "apps/pos-web/**"
      - "apps/api/**"
      - "packages/foundation/**"
      - "packages/ui/**"
      - "modules/**"
      - "database/**"
      - "tests/unit/persistent-admin-pos-staging.test.mjs"
      - "tests/unit/staging-operability.test.mjs"
      - "tests/unit/staging-outbox-publisher.test.mjs"
      - "tests/unit/staging-operational-release.test.mjs"
      - "tests/unit/staging-auth-origin.test.mjs"
      - "tests/unit/staging-read-context.test.mjs"
      - "tests/unit/staging-mfa.test.mjs"
      - "tests/unit/staging-command-token.test.mjs"
      - "tests/unit/staging-asymmetric-token.test.mjs"
      - "tests/unit/staging-asymmetric-deployment.test.mjs"
      - "tests/helpers/staging-token-keyset.mjs"
      - "tests/unit/staging-account-recovery.test.mjs"
      - "tooling/scripts/apply-migrations.mjs"
      - "tooling/scripts/deploy-custom-auth-staging.mjs"
      - "tooling/scripts/run-custom-auth-staging.mjs"
      - "tooling/scripts/staging-custom-auth-patch.mjs"
      - "tooling/scripts/staging-token-keyset.mjs"
      - "tooling/scripts/staging-mfa-reservation-evidence.mjs"
      - "tooling/scripts/staging-account-recovery-evidence.mjs"
      - "tooling/scripts/run-operational-staging.mjs"
      - "tooling/scripts/staging-operability.mjs"
      - "tooling/scripts/staging-outbox-publisher.mjs"
      - "tooling/scripts/staging-operational-runner.mjs"
      - "docs/architecture/staging/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/persistent-admin-pos-staging.yml"

concurrency:
  group: persistent-admin-pos-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Verify repository and staging Worker
        run: npm run verify
      - name: Deploy persistent staging
        run: npm run ci:staging-deploy
      - name: Publish staging URL summary
        if: always()
        run: |
          node <<'NODE'
          const { readFileSync, appendFileSync, existsSync } = require('node:fs');
          const reportPath = 'artifacts/staging/persistent-staging-report.json';
          if (!existsSync(reportPath)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Persistent staging\n\nNo deployment report was produced.\n');
            process.exit(0);
          }
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          const browser = Array.isArray(report.browser) ? report.browser : [];
          const operability = report.operability ?? {};
          const publisher = report.outboxPublisher ?? {};
          const alerts = Array.isArray(operability.alerts) ? operability.alerts : [];
          const lines = [
            '## Persistent staging',
            '',
            `- Status: ${report.status}`,
            `- Worker: ${report.workerName}`,
            `- URL: ${report.baseUrl ?? 'not available'}`,
            `- Git SHA: ${report.gitSha}`,
            `- Persistent: ${report.persistent === true ? 'yes' : 'not confirmed'}`,
            `- Browser data: ${report.syntheticOnly === true ? 'synthetic only' : 'not confirmed'}`,
            `- Authentication: ${report.authentication?.provider ?? 'not confirmed'}`,
            `- Password hashing: ${report.authentication?.passwordHash ?? 'not confirmed'}`,
            `- Internal token algorithm: ${report.internalToken?.algorithm ?? 'not confirmed'}`,
            `- Internal token active/previous verification keys: ${report.internalToken?.activeVerificationKeyCount ?? 'not available'}/${report.internalToken?.previousVerificationKeyCount ?? 'not available'}`,
            `- Internal token published/revoked keys: ${report.internalToken?.publishedKeyCount ?? 'not available'}/${report.internalToken?.revokedKeyCount ?? 'not available'}`,
            `- Internal token rotation overlap: ${report.internalToken?.rotationOverlapSeconds ?? 'not available'} seconds`,
            `- Internal token private fields published: ${report.internalToken?.privateFieldsPublished ?? 'not available'}`,
            `- Internal token key material in artifacts: ${report.internalToken?.privateKeyPersistedInArtifacts === false && report.internalToken?.keysetPersistedInArtifacts === false ? 'no' : 'not confirmed'}`,
            `- TOTP MFA: ${report.mfa?.provider === 'totp' && report.mfa?.encryptedAtRest === true ? 'passed' : 'not confirmed'}`,
            `- Single-use step-up replay rejection: ${report.mfa?.replayRejected === true ? 'passed' : 'not confirmed'}`,
            `- Reservation create/release: ${report.controlledCommand?.createPassed === true && report.controlledCommand?.releasePassed === true ? 'passed' : 'not confirmed'}`,
            `- Reservation availability reconciliation: ${report.controlledCommand?.availabilityReconciled === true ? 'passed' : 'not confirmed'}`,
            `- Synthetic reservation cleanup: ${report.controlledCommand?.syntheticReservationCleaned === true ? 'passed' : 'not confirmed'}`,
            `- Password recovery non-enumeration: ${report.accountRecovery?.nonEnumeratingRequest === true ? 'passed' : 'not confirmed'}`,
            `- Password reset and credential rotation: ${report.accountRecovery?.resetCompleted === true && report.accountRecovery?.oldPasswordRejected === true && report.accountRecovery?.newPasswordAccepted === true ? 'passed' : 'not confirmed'}`,
            `- Recovery token replay rejection: ${report.accountRecovery?.resetReplayRejected === true ? 'passed' : 'not confirmed'}`,
            `- Session, MFA and step-up revocation: ${report.accountRecovery?.oldSessionRevoked === true && report.accountRecovery?.mfaFactorsRevoked === true && report.accountRecovery?.outstandingStepUpRevoked === true ? 'passed' : 'not confirmed'}`,
            `- Email verification lifecycle: ${report.accountRecovery?.emailVerificationCompleted === true && report.accountRecovery?.verificationReplayRejected === true ? 'passed' : 'not confirmed'}`,
            `- Production email delivery: ${report.accountRecovery?.productionEmailDeliveryConfigured === true ? 'configured' : 'not configured'}`,
            `- Synthetic auth account cleanup: ${report.authentication?.syntheticAccountCleaned === true ? 'passed' : 'not confirmed'}`,
            `- Legacy Neon Auth removed: ${report.authentication?.legacyNeonAuthRemoved === true ? 'yes' : 'not confirmed'}`,
            `- General authoritative browser writes: ${report.authoritativeBrowserWritesEnabled === true ? 'enabled' : 'disabled'}`,
            `- Live browser scenarios: ${browser.filter((item) => item.passed === true).length}/${browser.length}`,
            `- Axe violations: ${browser.reduce((total, item) => total + (item.violations?.length ?? 0), 0)}`,
            `- Outbox publisher consumer: ${publisher.consumer ?? 'not available'}`,
            `- Outbox claimed/delivered/replayed: ${publisher.claimed ?? 'not available'}/${publisher.delivered ?? 'not available'}/${publisher.replayed ?? 'not available'}`,
            `- Outbox failed/remaining/exhausted: ${publisher.failed ?? 'not available'}/${publisher.remaining ?? 'not available'}/${publisher.exhausted ?? 'not available'}`,
            `- Outbox payloads in artifacts: ${publisher.payloadsPersistedInArtifacts === false ? 'no' : 'not confirmed'}`,
            `- External outbox delivery: ${publisher.externalDelivery === false ? 'disabled' : 'not confirmed'}`,
            `- Operability status: ${operability.status ?? 'not available'}`,
            `- Operability launch gate: ${operability.launchGate ?? 'not available'}`,
            `- Operability warnings: ${operability.warningCount ?? 'not available'}`,
            `- Operability critical alerts: ${operability.criticalCount ?? 'not available'}`,
            '',
          ];
          if (alerts.length > 0) {
            lines.push('### Operability alerts', '');
            for (const alert of alerts) {
              lines.push(`- \`${alert.alertId}\` · ${alert.severity} · owner \`${alert.owner}\` · runbook \`${alert.runbook}\``);
            }
            lines.push('');
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
      - name: Upload persistent staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persistent-admin-pos-staging-${{ github.run_id }}
          path: artifacts/staging/
          if-no-files-found: warn
          retention-days: 30
