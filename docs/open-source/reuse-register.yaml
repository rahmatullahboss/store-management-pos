  - id: OSS-0006
    status: approved_adaptation
    purpose: Selectively adapt the reviewed Cloudflare/Astro buyer-storefront presentation, theme, cache, SEO, media and test patterns for MOD-H while retaining the existing Ozzyl Neon commerce backend as the sole authority.
    reuse_mode: adapted_component
    project: Storefront commerce source adaptation
    repository: https://github.com/scaliuslabs/scalius-commerce-lite
    exact_commit_or_tag: 4cb83aecb6d27483951618dcf8398592e662f241
    version: reviewed-mono-repo-baseline-2026-07-30
    files_or_packages:
      - docs/architecture/storefront/upstream-file-manifest.yaml
