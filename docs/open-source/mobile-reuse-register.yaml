  - id: OSS-MOB-0003
    status: approved_dependency_pending_lock_evidence
    purpose: Bundle reviewed SQLite native assets and expose the runtime API used to prove encrypted database support.
    reuse_mode: package_and_native_asset_dependency
    project: sqlite3 for Dart
    repository: https://github.com/simolus3/sqlite3.dart
    exact_commit_or_tag: pub.dev-release-3.5.0
    version: 3.5.0
    files_or_packages:
      - sqlite3
    declared_license: MIT
    file_level_licenses_checked: true
    notice_files:
      - upstream:LICENSE
    modifications: Workspace build hooks select the upstream-provided sqlite3mc binary set; no source patch is carried.
    product_locations:
      - mobile/pubspec.yaml
      - mobile/packages/local_data/pubspec.yaml
      - mobile/packages/local_data/lib/store_companion_local_data.dart
    distributed_to_customers: true
    network_service_use: false
    compatible_with_product_model: approved
    legal_review:
      required: false
      reviewer: mob-01-engineering-policy
      decision: approved_permissive_native_binding
      date: 2026-07-29
    security_review:
      owner: MOB-01
      result: fail_closed_pragma_cipher_probe_required_before_local_schema_open
    update_owner: MOB-01
    upstream_tracking: Track sqlite3 package release, bundled SQLite and SQLite3MultipleCiphers versions and binary digests as one checkpoint.
    sbom_components:
      - pkg:pub/sqlite3@3.5.0
    third_party_notice_entry: pending_programme_integration_into_docs/THIRD_PARTY_NOTICES.md
    tests:
      - runtime PRAGMA cipher evidence
      - Android development staging and production-identity debug builds
    prohibited_legacy_dependencies:
      - sqlite3_flutter_libs
      - sqlcipher_flutter_libs
      - sqlite3_native_assets

  - id: OSS-MOB-0004
    status: approved_native_component_pending_lock_evidence
    purpose: Encrypt the Store Companion local SQLite file using the cipher build supplied and integrity-pinned by package sqlite3.
    reuse_mode: native_binary_selected_by_pub_build_hook
    project: SQLite3 Multiple Ciphers
    repository: https://github.com/utelle/SQLite3MultipleCiphers
    exact_commit_or_tag: bundled-by-sqlite3-3.5.0
    version: 2.3.6
    files_or_packages:
      - sqlite3mc native libraries selected by hooks.user_defines.sqlite3.source
    declared_license: MIT
    file_level_licenses_checked: true
    notice_files:
      - upstream:LICENSE
      - upstream:LICENSE.spdx
    modifications: No upstream source copied or modified. Precompiled native assets are selected through the sqlite3 package hook and verified by that package's embedded SHA-256 references.
    product_locations:
      - mobile/pubspec.yaml
    distributed_to_customers: true
    network_service_use: false
    compatible_with_product_model: approved_with_runtime_assertion
    legal_review:
      required: false
      reviewer: mob-01-engineering-policy
      decision: approved_permissive_encryption_component
      date: 2026-07-29
    security_review:
      owner: MOB-01
      result: runtime_cipher_probe_key_redaction_wrong_key_and_corruption_tests_required
    update_owner: MOB-01
    upstream_tracking: Review cipher defaults, bundled SQLite version, cryptographic changes and migration compatibility before upgrade.
    sbom_components:
      - pkg:github/utelle/SQLite3MultipleCiphers@2.3.6
    third_party_notice_entry: pending_programme_integration_into_docs/THIRD_PARTY_NOTICES.md
    tests:
      - PRAGMA cipher must return non-empty evidence
      - application must fail closed when cipher is unavailable

  - id: OSS-MOB-0005
