    - upstream_API_and_core_business_services
    - global_or_cross_tenant_cache_keys
    - browser_authoritative_price_tax_stock_or_checkout_logic
    - floating_point_money
    - upstream_media_CDN_authority
  authority_boundary:
    - MOD_A_owns_product_category_media_price_promotion_and_tax_inputs
    - MOD_B_owns_stock_availability_and_reservations
    - MOD_H_owns_public_slugs_crawler_policy_presentation_and_cache_generations
    - PostgreSQL_Neon_remains_canonical
    - Cloudflare_cache_KV_and_R2_are_delivery_infrastructure_only
  required_evidence:
    - root_format_type_boundary_migration_build_and_unit_gates
    - PostgreSQL_17_published_only_SEO_rehearsal
    - robots_sitemap_canonical_and_structured_data_security_tests
    - Worker_GET_HEAD_content_type_and_scope_reconciliation
    - Cloudflare_preview_runtime_cleanup
    - non_destructive_Neon_recovery
  local_owner: MOD-H-storefront-commerce
