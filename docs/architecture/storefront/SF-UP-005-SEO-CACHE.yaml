  modifications:
    - replaced upstream hostname and store discovery with active local canonical-host resolution
    - replaced upstream D1 and KV authority with PostgreSQL security-definer read projections and generation rows
    - restricted sitemap entries to locally published products categories collections and content pages
    - required products to pass the verified exact-price and availability public composition
    - added bounded contract validation duplicate rejection and encoded-traversal denial
    - added exact integer-minor to decimal-string product structured-data formatting
    - escaped XML and JSON script-termination characters
    - adapted responsive media transforms only for safe relative assets or explicitly allowlisted HTTPS CDN hosts
    - retained original asset delivery for foreign HTTPS hosts and non-resizable SVG or icon media
    - added local width quality format and fit bounds plus deterministic low-bandwidth widths
    - classified bootstrap content catalog product category collection search sitemap and media cache families
    - isolated cache-family keys by tenant storefront channel request and canonical host locale currency price revision publication generation build family generation and resource
    - changed missing malformed or timed-out cache generation lookup from upstream default-generation fallback to local fail-closed bypass
    - normalised API base-path joins and cache resource tokens so trailing slashes cannot create malformed public URLs or family keys
    - added Bengali bounded-3G and Japanese CJK browser evidence alongside English and Arabic RTL
    - removed upstream branding analytics demo data fixed IDs and environment constants
