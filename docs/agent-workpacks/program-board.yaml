  execution_mode: controlled_parallel_module_agents
  current_agent_scope: MOD-F
  delegation_unit: whole_module_workpack
  prohibit_subtask_agents: true
  module_agent_launch_condition: foundation_gate_passed
  post_foundation_execution_mode: controlled_parallel_module_agents
  integration_mode: serial
  integration_branch: program/integration-v1
  foundation_branch: program/foundation-v1
  foundation_neon_branch: dev/foundation-v1
