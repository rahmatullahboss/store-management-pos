program:
  name: international-store-management-pos
  status: foundation_complete
  execution_mode: controlled_parallel_module_agents
  current_agent_scope: PROGRAM_INTEGRATION
  delegation_unit: whole_module_workpack
  prohibit_subtask_agents: true
  module_agent_launch_condition: foundation_gate_passed
  post_foundation_execution_mode: controlled_parallel_module_agents
  integration_mode: serial
  integration_branch: program/integration-v1
  foundation_branch: program/foundation-v1
  foundation_neon_branch: dev/foundation-v1
  database_provider: neon
  database_connection: direct_neon_serverless_driver
  hyperdrive: optional_benchmark_only
  updated_at: 2026-07-28

status_values: [blocked, ready, active, handoff_ready, integration_review, integrated, rework, complete]

activation_policy:
  current_phase:
    owner_count: 0
    owner_workpack: PROGRAM_INTEGRATION
    module_agents_allowed: true
    reason: foundation_gate_passed
    continuation: activate_wave_1_whole_module_agents_from_the_approved_foundation_baseline
  after_foundation_gate:
    module_agents_allowed: true
    assignment_rule: one_agent_one_complete_workpack
    maximum_parallel_workpacks: 7
    development_parallelism: allowed_in_isolated_branches
    integration_parallelism: prohibited
    dependency_strategy: frozen_contracts_and_approved_simulators
    recommended_launch_waves:
      - wave: 1
        workpacks: [MOD-A, MOD-B, MOD-C, MOD-E]
        prerequisites: [foundation_complete, contracts_v1_frozen, dependency_fixtures_ready]
      - wave: 2
        workpacks: [MOD-D, MOD-F]
        prerequisites: [wave_1_contract_checkpoints_available]
      - wave: 3
        workpacks: [MOD-G]
        prerequisites: [cross_module_reporting_and_integration_contracts_stable]
    integration_order: [MOD-A, MOD-B, MOD-C, MOD-E, MOD-D, MOD-F, MOD-G]

