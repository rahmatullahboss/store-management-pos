rules:
  one_owner_per_workpack: true
  one_git_branch_per_workpack: true
  one_worktree_per_workpack: true
  one_neon_branch_per_workpack: true
  module_agent_may_spawn_subagents: false
  small_task_agent_assignment: prohibited
  module_agent_may_edit_shared_contracts: false
  module_agent_may_edit_other_module_paths: false
  shared_contract_change_requires_cr: true
  production_database_access_for_agents: false
  production_data_in_preview_branches: false
  module_merge_parallelism: one_at_a_time
  development_parallelism_after_foundation: true
  tracker_update_required_at_each_checkpoint: true
  documentation_update_required_before_status_transition: true
  handoff_required_before_owner_change: true
  evidence_required_before_status_change: true
