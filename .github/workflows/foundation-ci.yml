name: Foundation CI

on:
  pull_request:
    branches:
      - main
      - program/integration-v1
  push:
    branches:
      - main
      - program/integration-v1
  workflow_dispatch:

concurrency:
  group: foundation-ci-${{ (github.event.pull_request.head.ref == 'module/localization-compliance-v1' || github.event.pull_request.head.ref == 'module/reporting-integrations-saas-v1' || github.event.pull_request.head.ref == 'program/integration-v1') && github.sha || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Architecture boundaries
        run: npm run check:boundaries
      - name: Typecheck
        run: npm run typecheck
      - name: Build and tests
        run: npm test
      - name: Secret scan
        run: npm run check:secrets
      - name: Licence register
        run: npm run check:licenses
      - name: Generate SBOM
        run: npm run sbom
      - name: Dependency audit
        run: npm audit --audit-level=high

  neon-preview:
    # Active module and integration-release PRs use persistent assigned branches below.
    # Database-free marketing and dependency work is verified by core, recovery, Cloudflare and browser
    # gates without consuming an ephemeral branch on the quota-limited non-production project.
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.head.ref != 'module/pos-cash-offline-v1' && github.event.pull_request.head.ref != 'module/localization-compliance-v1' && github.event.pull_request.head.ref != 'module/reporting-integrations-saas-v1' && github.event.pull_request.head.ref != 'program/integration-v1' && github.event.pull_request.head.ref != 'feature/marketing-landing-page' && !startsWith(github.event.pull_request.head.ref, 'deps/')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - verify
      - neon-recovery
    concurrency:
      group: neon-preview-lifecycle-${{ github.repository }}
      cancel-in-progress: false
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: twilight-boat-26805962
      NEON_PARENT_BRANCH_ID: br-spring-grass-ax3ptydv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run ci:neon-preview
      - name: Upload Neon preview evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-foundation-${{ github.run_id }}
          path: |
            artifacts/foundation/neon-benchmark-report.json
            artifacts/foundation/neon-preview-lifecycle.json
          if-no-files-found: warn
          retention-days: 14

  neon-recovery:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    concurrency:
      group: neon-preview-lifecycle-${{ github.repository }}
      cancel-in-progress: false
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run ci:neon-recovery
      - name: Upload Neon recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-recovery-${{ github.run_id }}
          path: artifacts/foundation/neon-recovery-report.json
          if-no-files-found: warn
          retention-days: 14

  mod-d-neon-rehearsal:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'module/pos-cash-offline-v1' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    concurrency:
      group: mod-d-neon-rehearsal-${{ github.repository }}
      cancel-in-progress: false
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: twilight-boat-26805962
      MOD_D_NEON_BRANCH_ID: br-rapid-river-axoz0rfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run ci:neon-mod-d
      - name: Upload MOD-D Neon rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-mod-d-${{ github.run_id }}
          path: artifacts/mod-d/neon-rehearsal.json
          if-no-files-found: error
          retention-days: 14

  mod-f-neon-rehearsal:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'module/localization-compliance-v1' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify
    concurrency:
      group: mod-f-neon-rehearsal-${{ github.repository }}
      cancel-in-progress: false
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: twilight-boat-26805962
      MOD_F_NEON_BRANCH_ID: br-polished-flower-ax2ph8wp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Apply and verify complete chain through MOD-F
        run: node tooling/scripts/mod-f-neon-rehearsal-ci.mjs
      - name: Verify deterministic migration replay
        run: node tooling/scripts/mod-f-neon-rehearsal-ci.mjs
      - name: Upload MOD-F Neon rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-mod-f-${{ github.run_id }}
          path: artifacts/mod-f/neon-rehearsal.json
          if-no-files-found: error
          retention-days: 14

  mod-g-neon-rehearsal:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && (github.event.pull_request.head.ref == 'module/reporting-integrations-saas-v1' || (github.event.pull_request.head.ref == 'program/integration-v1' && github.event.pull_request.base.ref == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify
    concurrency:
      group: mod-g-neon-rehearsal-${{ github.repository }}
      cancel-in-progress: false
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: twilight-boat-26805962
      MOD_G_NEON_BRANCH_ID: br-mute-band-axbhmsky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Apply and verify complete chain through MOD-G
        run: npm run ci:neon-mod-g
      - name: Verify deterministic migration replay
        run: npm run ci:neon-mod-g
      - name: Upload MOD-G Neon rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-mod-g-${{ github.run_id }}
          path: artifacts/mod-g/neon-rehearsal.json
          if-no-files-found: error
          retention-days: 14

  cloudflare-preview:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run ci:cloudflare-preview
      - run: npm run metrics:cloudflare-runtime
      - name: Cleanup Cloudflare preview Worker
        if: always()
        run: npm run cleanup:cloudflare-preview
      - name: Upload Cloudflare Foundation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-foundation-${{ github.run_id }}
          path: artifacts/foundation/cloudflare-*.json
          if-no-files-found: warn
          retention-days: 14

  mod-g-final-readiness:
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && (github.event.pull_request.head.ref == 'module/reporting-integrations-saas-v1' || (github.event.pull_request.head.ref == 'program/integration-v1' && github.event.pull_request.base.ref == 'main')) && needs.verify.result == 'success' && needs['mod-g-neon-rehearsal'].result == 'success' && needs['neon-recovery'].result == 'success' && needs['cloudflare-preview'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - verify
      - mod-g-neon-rehearsal
      - neon-recovery
      - cloudflare-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify final MOD-G readiness evidence
        run: npm run mod-g:final:verify
      - name: Upload MOD-G final readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-g-final-${{ github.run_id }}
          path: artifacts/mod-g-final/
          if-no-files-found: error
          retention-days: 14
