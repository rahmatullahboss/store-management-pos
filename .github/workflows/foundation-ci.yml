name: Foundation CI

on:
  pull_request:
    branches:
      - main
      - program/integration-v1
  workflow_dispatch:

concurrency:
  group: foundation-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Architecture boundaries
        run: npm run check:boundaries
      - name: Typecheck
        run: npm run typecheck
      - name: Build and tests
        run: npm test
      - name: Secret scan
        run: npm run check:secrets
      - name: Licence register
        run: npm run check:licenses
      - name: Generate SBOM
        run: npm run sbom
      - name: Dependency audit
        run: npm audit --audit-level=high

  neon-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: twilight-boat-26805962
      NEON_PARENT_BRANCH_ID: br-spring-grass-ax3ptydv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run ci:neon-preview
      - name: Upload Neon preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neon-foundation-${{ github.run_id }}
          path: |
            artifacts/foundation/neon-benchmark-report.json
            artifacts/foundation/neon-preview-lifecycle.json
          if-no-files-found: warn
          retention-days: 14

  neon-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run ci:neon-recovery
      - name: Upload Neon recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neon-recovery-${{ github.run_id }}
          path: artifacts/foundation/neon-recovery-report.json
          if-no-files-found: warn
          retention-days: 14

  cloudflare-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run ci:cloudflare-preview
      - run: npm run metrics:cloudflare-runtime
      - name: Cleanup Cloudflare preview Worker
        if: always()
        run: npm run cleanup:cloudflare-preview
      - name: Upload Cloudflare Foundation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-foundation-${{ github.run_id }}
          path: artifacts/foundation/cloudflare-*.json
          if-no-files-found: warn
          retention-days: 14
