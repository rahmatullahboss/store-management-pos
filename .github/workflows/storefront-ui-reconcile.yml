name: Storefront UI Reconcile

on:
  push:
    branches:
      - module/storefront-commerce-v1
    paths:
      - .github/workflows/storefront-ui-reconcile.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: module/storefront-commerce-v1
      - name: Apply exact evidence-backed replacements
        shell: python
        run: |
          from pathlib import Path

          component = Path("apps/storefront-web/src/components/ProductCard.astro")
          content = component.read_text()
          old_colour = "color: color-mix(in srgb, var(--storefront-foreground) 58%, transparent);"
          new_colour = "color: color-mix(in srgb, var(--storefront-foreground) 72%, transparent);"
          if content.count(old_colour) != 1:
              raise SystemExit(f"expected one compare-price colour replacement, found {content.count(old_colour)}")
          component.write_text(content.replace(old_colour, new_colour))

          runner = Path("tooling/scripts/storefront-design-evidence.mjs")
          content = runner.read_text()
          old_readiness = "`${origin}/__evidence/storefront?locale=en-GB`"
          new_readiness = "`${origin}/evidence/storefront?locale=en-GB`"
          old_route = 'new URL("/__evidence/storefront", origin)'
          new_route = 'new URL("/evidence/storefront", origin)'
          if content.count(old_readiness) != 1:
              raise SystemExit(f"expected one readiness URL replacement, found {content.count(old_readiness)}")
          if content.count(old_route) != 1:
              raise SystemExit(f"expected one scenario URL replacement, found {content.count(old_route)}")
          content = content.replace(old_readiness, new_readiness).replace(old_route, new_route)
          runner.write_text(content)
      - name: Commit reconciled UI evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront-web/src/components/ProductCard.astro tooling/scripts/storefront-design-evidence.mjs
          git commit -m "fix(storefront): satisfy contrast and RTL evidence"
          git push origin HEAD:module/storefront-commerce-v1
