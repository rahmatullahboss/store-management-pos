name: Dependency Lock Refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'deps/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Regenerate lockfile from exact package pins
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify requested axe-core version
        run: node -e "const lock=require('./package-lock.json'); if(lock.packages['node_modules/axe-core']?.version !== '4.12.1') process.exit(1)"
      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
