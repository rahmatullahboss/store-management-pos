name: Apply asymmetric token checkpoint

on:
  push:
    branches:
      - agent/asymmetric-internal-token-jwks
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-asymmetric-token-checkpoint
  cancel-in-progress: false

jobs:
  assemble-verify-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/asymmetric-internal-token-jwks
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Assemble checkpoint overlay
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib

          expected = "66cc18095a55c3007f6711a27f00380ac643078da18d6a73ca5983d0f3618a2a"
          paths = sorted(pathlib.Path(".checkpoint").glob("asymmetric-overlay-*.b64"))
          if len(paths) != 5:
              raise SystemExit(f"expected 5 checkpoint chunks, found {len(paths)}")
          chunks = [path.read_text(encoding="utf-8").strip() for path in paths]
          damaged = "XWV6XdfOREiDE7n"
          repaired = "XWV6XdfFOREiDE7n"
          if chunks[2].count(damaged) != 1 or repaired in chunks[2]:
              raise SystemExit("checkpoint chunk 02 corruption signature is not exact")
          chunks[2] = chunks[2].replace(damaged, repaired)
          encoded = "".join(chunks)
          encoded += "=" * (-len(encoded) % 4)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          print(f"repaired checkpoint bytes={len(payload)} sha256={digest}")
          if digest != expected:
              raise SystemExit("repaired checkpoint digest mismatch")
          pathlib.Path("/tmp/asymmetric-overlay.tar.gz").write_bytes(payload)
          PY
          echo "66cc18095a55c3007f6711a27f00380ac643078da18d6a73ca5983d0f3618a2a  /tmp/asymmetric-overlay.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/asymmetric-overlay.tar.gz
          tar --extract --gzip --file /tmp/asymmetric-overlay.tar.gz --directory .
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tooling/scripts/apply-asymmetric-checkpoint.py")
          text = path.read_text()
          old = "    signing_algorithm: HS256_staging_only\\n    signing_secret: [REDACTED_SECRET]\\n    deployment_rotation: enabled"
          new = "    signing_algorithm: HS256_staging_only\\n    signing_secret: cloudflare_worker_secret\\n    deployment_rotation: enabled"
          if text.count(old) != 1:
              raise SystemExit("checkpoint status anchor repair target mismatch")
          path.write_text(text.replace(old, new))
          PY
          python3 tooling/scripts/apply-asymmetric-checkpoint.py
          rm -rf .checkpoint
          rm -f tooling/scripts/apply-asymmetric-checkpoint.py
          rm -f .github/workflows/apply-asymmetric-checkpoint.yml
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Verify focused asymmetric contracts
        run: |
          npm run build
          node --test \
            tests/unit/staging-asymmetric-token.test.mjs \
            tests/unit/staging-asymmetric-deployment.test.mjs \
            tests/unit/staging-internal-token.test.mjs \
            tests/unit/staging-command-token.test.mjs \
            tests/unit/staging-operational-release.test.mjs
      - name: Verify full repository
        run: npm run verify
      - name: Commit verified checkpoint
        run: |
          git diff --check
          git status --short
          git config user.name "Ozzyl Enterprise Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: add asymmetric internal token lifecycle"
          git push origin HEAD:agent/asymmetric-internal-token-jwks
