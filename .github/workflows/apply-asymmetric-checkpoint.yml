name: Apply asymmetric token checkpoint

# Verification trigger: obsolete status rewrite removed.
on:
  push:
    branches:
      - agent/asymmetric-internal-token-jwks
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-asymmetric-token-checkpoint
  cancel-in-progress: false

jobs:
  assemble-verify-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/asymmetric-internal-token-jwks
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Assemble checkpoint overlay
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib

          expected = "66cc18095a55c3007f6711a27f00380ac643078da18d6a73ca5983d0f3618a2a"
          paths = sorted(pathlib.Path(".checkpoint").glob("asymmetric-overlay-*.b64"))
          if len(paths) != 5:
              raise SystemExit(f"expected 5 checkpoint chunks, found {len(paths)}")
          chunks = [path.read_text(encoding="utf-8").strip() for path in paths]
          damaged = "XWV6XdfOREiDE7n"
          repaired = "XWV6XdfFOREiDE7n"
          if chunks[2].count(damaged) != 1 or repaired in chunks[2]:
              raise SystemExit("checkpoint chunk 02 corruption signature is not exact")
          chunks[2] = chunks[2].replace(damaged, repaired)
          encoded = "".join(chunks)
          encoded += "=" * (-len(encoded) % 4)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          print(f"repaired checkpoint bytes={len(payload)} sha256={digest}")
          if digest != expected:
              raise SystemExit("repaired checkpoint digest mismatch")
          pathlib.Path("/tmp/asymmetric-overlay.tar.gz").write_bytes(payload)
          PY
          echo "66cc18095a55c3007f6711a27f00380ac643078da18d6a73ca5983d0f3618a2a  /tmp/asymmetric-overlay.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/asymmetric-overlay.tar.gz
          tar --extract --gzip --file /tmp/asymmetric-overlay.tar.gz --directory .
          python3 tooling/scripts/apply-asymmetric-checkpoint.py
          python3 - <<'PY'
          from pathlib import Path

          source = Path("apps/api/src/staging-asymmetric-token.ts")
          text = source.read_text()
          old = '''  const signingInput = `${headerSegment}.${payloadSegment}`;
          const verified = await crypto.subtle.verify(
            "RSASSA-PKCS1-v1_5",
            publicKey,
            decodeBase64Url(signatureSegment, "Staging token signature is invalid"),
            encoder.encode(signingInput),
          );'''
          new = '''  const signingInput = `${headerSegment}.${payloadSegment}`;
          const decodedSignature = decodeBase64Url(
            signatureSegment,
            "Staging token signature is invalid",
          );
          const signature = new Uint8Array(decodedSignature.byteLength);
          signature.set(decodedSignature);
          const verified = await crypto.subtle.verify(
            "RSASSA-PKCS1-v1_5",
            publicKey,
            signature.buffer,
            encoder.encode(signingInput),
          );'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("RS256 signature BufferSource repair target is ambiguous")
              source.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit("RS256 signature BufferSource is neither original nor repaired")
          PY
          rm -rf .checkpoint
          rm -f tooling/scripts/apply-asymmetric-checkpoint.py
          rm -f .github/workflows/apply-asymmetric-checkpoint.yml
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Verify focused asymmetric contracts
        run: |
          npm run build
          node --test \
            tests/unit/staging-asymmetric-token.test.mjs \
            tests/unit/staging-asymmetric-deployment.test.mjs \
            tests/unit/staging-internal-token.test.mjs \
            tests/unit/staging-command-token.test.mjs \
            tests/unit/staging-operational-release.test.mjs
      - name: Normalize generated lifecycle evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/architecture/staging/internal-token-key-lifecycle.md")
          if not path.exists():
              raise SystemExit("asymmetric key lifecycle document was not generated")
          lines = path.read_text().splitlines()
          indexes = [index for index, line in enumerate(lines) if line.rstrip() != line]
          if len(indexes) != 1:
              raise SystemExit(f"expected one lifecycle whitespace line, found {len(indexes)}")
          lines[indexes[0]] = lines[indexes[0]].rstrip()
          path.write_text("\n".join(lines) + "\n")
          PY
      - name: Verify full repository
        run: npm run verify
      - name: Commit verified checkpoint
        run: |
          git diff --check
          git status --short
          git config user.name "Ozzyl Enterprise Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: add asymmetric internal token lifecycle"
          git push origin HEAD:agent/asymmetric-internal-token-jwks
