name: Apply asymmetric token checkpoint

# Verification trigger: code push excludes workflow mutations; connector transfers them after verification.
on:
  push:
    branches:
      - agent/asymmetric-internal-token-jwks
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-asymmetric-token-checkpoint
  cancel-in-progress: false

jobs:
  assemble-verify-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/asymmetric-internal-token-jwks
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Assemble checkpoint overlay
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib

          expected = "66cc18095a55c3007f6711a27f00380ac643078da18d6a73ca5983d0f3618a2a"
          paths = sorted(pathlib.Path(".checkpoint").glob("asymmetric-overlay-*.b64"))
          if len(paths) != 5:
              raise SystemExit(f"expected 5 checkpoint chunks, found {len(paths)}")
          chunks = [path.read_text(encoding="utf-8").strip() for path in paths]
          damaged = "XWV6XdfOREiDE7n"
          repaired = "XWV6XdfFOREiDE7n"
          if chunks[2].count(damaged) != 1 or repaired in chunks[2]:
              raise SystemExit("checkpoint chunk 02 corruption signature is not exact")
          chunks[2] = chunks[2].replace(damaged, repaired)
          encoded = "".join(chunks)
          encoded += "=" * (-len(encoded) % 4)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          print(f"repaired checkpoint bytes={len(payload)} sha256={digest}")
          if digest != expected:
              raise SystemExit("repaired checkpoint digest mismatch")
          pathlib.Path("/tmp/asymmetric-overlay.tar.gz").write_bytes(payload)
          PY
          echo "66cc18095a55c3007f6711a27f00380ac643078da18d6a73ca5983d0f3618a2a  /tmp/asymmetric-overlay.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/asymmetric-overlay.tar.gz
          tar --extract --gzip --file /tmp/asymmetric-overlay.tar.gz --directory .
          python3 - <<'PY'
          import ast
          from pathlib import Path

          patcher = Path("tooling/scripts/apply-asymmetric-checkpoint.py")
          text = patcher.read_text()
          tree = ast.parse(text)
          status_path = "docs/architecture/staging/status.yaml"
          marker = "[REDACTED_SECRET]"
          matches = []

          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              string_args = [
                  (index, argument)
                  for index, argument in enumerate(node.args)
                  if isinstance(argument, ast.Constant) and isinstance(argument.value, str)
              ]
              path_indexes = [
                  index for index, argument in string_args if argument.value == status_path
              ]
              if len(path_indexes) != 1:
                  continue
              path_index = path_indexes[0]
              old_value_args = [
                  argument
                  for index, argument in string_args
                  if index > path_index and marker in argument.value
              ]
              if old_value_args:
                  matches.append(old_value_args[0])

          if len(matches) != 1:
              raise SystemExit(
                  "expected one AST-scoped obsolete status value, "
                  f"found {len(matches)}"
              )

          target = matches[0]
          lines = text.splitlines(keepends=True)
          starts = []
          offset = 0
          for line in lines:
              starts.append(offset)
              offset += len(line)
          start = starts[target.lineno - 1] + target.col_offset
          end = starts[target.end_lineno - 1] + target.end_col_offset
          segment = text[start:end]
          if segment.count(marker) != 1:
              raise SystemExit(
                  "AST-scoped obsolete status value must contain exactly one marker"
              )
          repaired_segment = segment.replace(marker, "cloudflare_worker_secret")
          patcher.write_text(text[:start] + repaired_segment + text[end:])
          PY
          python3 tooling/scripts/apply-asymmetric-checkpoint.py
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("apps/api/src/staging-asymmetric-token.ts")
          text = source.read_text()
          desired = (
              "const decodedSignature = decodeBase64Url(" in text
              and "signature.buffer" in text
          )
          if not desired:
              signature_pattern = re.compile(
                  r'decodeBase64Url\(\s*signatureSegment,\s*'
                  r'"Staging token signature is invalid",?\s*\)',
                  re.MULTILINE,
              )
              matches = list(signature_pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(
                      "expected one direct staging signature decode expression, "
                      f"found {len(matches)}"
                  )
              match = matches[0]
              verify_start = text.rfind(
                  "const verified = await crypto.subtle.verify(",
                  0,
                  match.start(),
              )
              if verify_start < 0:
                  raise SystemExit("staging signature verify call was not found")
              line_start = text.rfind("\n", 0, verify_start) + 1
              indentation = text[line_start:verify_start]
              if indentation.strip():
                  raise SystemExit("staging signature verify indentation is invalid")
              declaration = (
                  f'{indentation}const decodedSignature = decodeBase64Url(\n'
                  f'{indentation}  signatureSegment,\n'
                  f'{indentation}  "Staging token signature is invalid",\n'
                  f'{indentation});\n'
                  f'{indentation}const signature = new Uint8Array(decodedSignature.byteLength);\n'
                  f'{indentation}signature.set(decodedSignature);\n'
              )
              repaired = (
                  text[:line_start]
                  + declaration
                  + text[line_start:match.start()]
                  + "signature.buffer"
                  + text[match.end():]
              )
              if repaired.count("const decodedSignature = decodeBase64Url(") != 1:
                  raise SystemExit("staging decoded signature declaration is not unique")
              if repaired.count("signature.buffer") != 1:
                  raise SystemExit("staging owned signature buffer is not unique")
              source.write_text(repaired)

          helper = Path("tooling/scripts/prebuild-asymmetric-checkpoint-fix.mjs")
          helper_text = helper.read_text()
          start_marker = 'replaceExact(\n  "apps/api/src/staging-asymmetric-token.ts",'
          end_marker = '\n\n{\n  const path = "apps/api/src/staging-asymmetric-token.ts";'
          start = helper_text.find(start_marker)
          end = helper_text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit("duplicate signature compatibility block is not uniquely bounded")
          if helper_text.find(start_marker, start + 1) >= 0:
              raise SystemExit("duplicate signature compatibility block is ambiguous")
          helper.write_text(helper_text[:start] + helper_text[end + 2:])

          status_test = Path("tests/unit/staging-read-context.test.mjs")
          status_test_text = status_test.read_text()
          old_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)protectedReadTransport: '
              r'"short-lived-internal-token",$'
          )
          old_matches = list(old_pattern.finditer(status_test_text))
          new_transport = (
              'protectedReadTransport: "short-lived-rs256-internal-token",'
          )
          if len(old_matches) == 1:
              old_match = old_matches[0]
              indent = old_match.group("indent")
              fields = [
                  'protectedReadTransport: "short-lived-rs256-internal-token",',
                  'internalTokenSigning: "RS256",',
                  'internalTokenKidRequired: true,',
                  'internalTokenJwksPath: "/internal-identity/.well-known/jwks.json",',
                  'internalTokenKeyLifecycle: "active-plus-previous-overlap-and-revocation",',
                  'internalTokenPrivateKeyPublished: false,',
              ]
              replacement = "\n".join(f"{indent}{field}" for field in fields)
              status_test_text = (
                  status_test_text[:old_match.start()]
                  + replacement
                  + status_test_text[old_match.end():]
              )
              status_test.write_text(status_test_text)
          elif len(old_matches) != 0 or new_transport not in status_test_text:
              raise SystemExit(
                  "staging status expectation is neither legacy nor RS256-aligned"
              )

          required_status_fields = [
              new_transport,
              'internalTokenSigning: "RS256",',
              'internalTokenKidRequired: true,',
              'internalTokenJwksPath: "/internal-identity/.well-known/jwks.json",',
              'internalTokenKeyLifecycle: "active-plus-previous-overlap-and-revocation",',
              'internalTokenPrivateKeyPublished: false,',
          ]
          final_status_test = status_test.read_text()
          for required_field in required_status_fields:
              if final_status_test.count(required_field) != 1:
                  raise SystemExit(
                      f"staging status expectation field is not unique: {required_field}"
                  )
          PY
          rm -rf .checkpoint
          rm -f tooling/scripts/apply-asymmetric-checkpoint.py
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Verify focused asymmetric contracts
        run: |
          npm run build
          node --test \
            tests/unit/staging-asymmetric-token.test.mjs \
            tests/unit/staging-asymmetric-deployment.test.mjs \
            tests/unit/staging-internal-token.test.mjs \
            tests/unit/staging-command-token.test.mjs \
            tests/unit/staging-operational-release.test.mjs
      - name: Normalize generated lifecycle evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/architecture/staging/internal-token-key-lifecycle.md")
          if not path.exists():
              print("lifecycle evidence will be generated by the full verification suite")
              raise SystemExit(0)
          lines = path.read_text().splitlines()
          indexes = [index for index, line in enumerate(lines) if line.rstrip() != line]
          if len(indexes) > 1:
              raise SystemExit(f"expected at most one lifecycle whitespace line, found {len(indexes)}")
          if indexes:
              lines[indexes[0]] = lines[indexes[0]].rstrip()
              path.write_text("\n".join(lines) + "\n")
          PY
      - name: Verify full repository
        run: npm run verify
      - name: Commit verified checkpoint without workflow mutations
        run: |
          mkdir -p tooling/transfer
          cp \
            .github/workflows/persistent-admin-pos-staging.yml \
            tooling/transfer/persistent-admin-pos-staging-asymmetric.yml
          git show \
            6be2f1fdde595c2f4fa8080cac68b7932d042ada:.github/workflows/persistent-admin-pos-staging.yml \
            > .github/workflows/persistent-admin-pos-staging.yml
          if ! git diff --quiet -- .github/workflows; then
            git diff -- .github/workflows
            echo "workflow mutation remained in the Actions-authenticated commit" >&2
            exit 1
          fi
          git diff --check
          git status --short
          git config user.name "Ozzyl Enterprise Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: add asymmetric internal token lifecycle"
          git push origin HEAD:agent/asymmetric-internal-token-jwks
