name: Storefront H1 Validation

on:
  pull_request:
    branches:
      - validation/storefront-h1-deterministic-base

permissions:
  contents: read

concurrency:
  group: storefront-h1-validation-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: storefront_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d storefront_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/storefront_test
      CHROME_PATH: /usr/bin/google-chrome
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install PostgreSQL client and exact dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          npm ci --ignore-scripts
      - name: Verify repository and Astro build
        run: |
          npm run format:check
          npm run lint
          npm run check:boundaries
          npm run typecheck
          npm run db:validate
          npm test
          npm run storefront:build
          npm run check:secrets
          npm run check:licenses
          npm run sbom
          npm audit --audit-level=high
      - name: Rehearse storefront PostgreSQL migrations and commands
        run: npm run storefront:db:rehearsal
      - name: Run deterministic storefront browser and accessibility evidence
        run: npm run storefront:design:verify
      - name: Run non-destructive Neon recovery evidence
        run: npm run ci:neon-recovery
      - name: Deploy application preview
        run: npm run ci:cloudflare-preview
      - name: Verify Cloudflare runtime metrics
        run: npm run metrics:cloudflare-runtime
      - name: Cleanup Cloudflare preview Worker
        if: always()
        run: npm run cleanup:cloudflare-preview
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storefront-h1-validation-${{ github.run_id }}
          path: |
            docs/architecture/storefront/design-evidence/
            artifacts/foundation/neon-recovery-report.json
            artifacts/foundation/cloudflare-*.json
          if-no-files-found: warn
          retention-days: 14
