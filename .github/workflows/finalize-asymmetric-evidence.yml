name: Finalize asymmetric live evidence

on:
  push:
    branches:
      - agent/asymmetric-internal-token-jwks

permissions:
  contents: write

concurrency:
  group: finalize-asymmetric-live-evidence
  cancel-in-progress: false

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/asymmetric-internal-token-jwks
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Patch exact live evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/architecture/staging/status.yaml")
          text = path.read_text()

          replacements = [
              (
                  "schema_version: 15\nworkstream: persistent-admin-pos-staging\nstatus: asymmetric_internal_token_implemented_pending_live_evidence",
                  "schema_version: 16\nworkstream: persistent-admin-pos-staging\nstatus: asymmetric_internal_token_live_evidence_complete_production_kms_pending",
              ),
              (
                  "verified_implementation_head: 2f589e3de7a7352757172fbb19937885487f04a2",
                  "verified_implementation_head: dc5b1f8328ad7d7f1c472c9ed446b24145a86229",
              ),
              (
                  "    live_evidence_state: implementation_complete_pending_exact_head",
                  "    live_evidence_state: exact_head_verified\n"
                  "    live_workflow_run_id: 30609623111\n"
                  "    live_workflow_job_id: 91089297482\n"
                  "    live_report_git_sha: 55c5b0ed3b366d8376e3018c4a625ee51369e931\n"
                  "    live_artifact_id: 8784940903\n"
                  "    live_artifact_digest: sha256:c6ed951221b83550aa05aa0836ae269d4dba28374fb914815a6775440f6dbd3f\n"
                  "    live_artifact_independent_inspection: passed\n"
                  "    published_verification_key_count: 2\n"
                  "    revoked_key_count: 0\n"
                  "    private_jwk_fields_published: 0\n"
                  "    artifact_credential_like_markers: 0",
              ),
              (
                  "evidence:\n"
                  "  implementation_head: 2f589e3de7a7352757172fbb19937885487f04a2\n"
                  "  workflow_head_sha: 2f589e3de7a7352757172fbb19937885487f04a2\n"
                  "  report_git_sha: c8f8e0d7fda3ffb1b5ed0331d9ab43eb60c09b79\n"
                  "  workflow_run_id: 30579560264\n"
                  "  workflow_job_id: 90996127068\n"
                  "  artifact_id: 8774097295\n"
                  "  artifact_digest: sha256:b2f3e18caf926a00494200ec51dc864d8837a9271c0afc8fb24a84b3e0a7be43\n"
                  "  artifact_independent_inspection: passed",
                  "evidence:\n"
                  "  implementation_head: dc5b1f8328ad7d7f1c472c9ed446b24145a86229\n"
                  "  workflow_head_sha: dc5b1f8328ad7d7f1c472c9ed446b24145a86229\n"
                  "  report_git_sha: 55c5b0ed3b366d8376e3018c4a625ee51369e931\n"
                  "  workflow_run_id: 30609623111\n"
                  "  workflow_job_id: 91089297482\n"
                  "  artifact_id: 8784940903\n"
                  "  artifact_digest: sha256:c6ed951221b83550aa05aa0836ae269d4dba28374fb914815a6775440f6dbd3f\n"
                  "  artifact_independent_inspection: passed",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"asymmetric evidence status anchor expected once, found {count}: {old[:80]!r}"
                  )
              text = text.replace(old, new)

          prohibited = [
              "asymmetric_internal_token_implemented_pending_live_evidence",
              "implementation_complete_pending_exact_head",
          ]
          for marker in prohibited:
              if marker in text:
                  raise SystemExit(f"stale asymmetric evidence marker remained: {marker}")

          path.write_text(text)
          PY
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Verify repository
        run: npm run verify
      - name: Commit evidence status
        run: |
          git diff --check
          git config user.name "Ozzyl Enterprise Agent"
          git config user.email "actions@users.noreply.github.com"
          git add docs/architecture/staging/status.yaml
          git commit -m "docs: finalize asymmetric token live evidence"
          git push origin HEAD:agent/asymmetric-internal-token-jwks
