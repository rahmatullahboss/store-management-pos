name: Mobile Platform Bootstrap

on:
  pull_request:
    branches:
      - program/integration-v1
      - main
    paths:
      - "tooling/mobile/generate-platform-projects.sh"
      - ".github/workflows/mobile-platform-bootstrap.yml"
      - "mobile/toolchain.yaml"
      - "mobile/pubspec.yaml"
      - "mobile/apps/store_companion/pubspec.yaml"
      - "mobile/packages/runtime_config/**"
  push:
    branches:
      - module/store-companion-mobile-v1
    paths:
      - "tooling/mobile/generate-platform-projects.sh"
      - ".github/workflows/mobile-platform-bootstrap.yml"
      - "mobile/toolchain.yaml"
      - "mobile/pubspec.yaml"
      - "mobile/apps/store_companion/pubspec.yaml"
      - "mobile/packages/runtime_config/**"
  workflow_dispatch:

concurrency:
  group: mobile-platform-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_COMMIT: 058e0af2c2b57e369d905a03ac9748b0ebf543c6

jobs:
  verify-platform-generation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact official Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter_dir="${RUNNER_TEMP}/flutter"
          git clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/flutter/flutter.git \
            "${flutter_dir}"
          git -C "${flutter_dir}" checkout --detach "${FLUTTER_COMMIT}"
          actual_commit="$(git -C "${flutter_dir}" rev-parse HEAD)"
          test "${actual_commit}" = "${FLUTTER_COMMIT}"
          echo "${flutter_dir}/bin" >> "${GITHUB_PATH}"
          "${flutter_dir}/bin/flutter" config --no-analytics
          "${flutter_dir}/bin/flutter" --version
      - name: Generate platforms and verify Android flavours
        run: bash tooling/mobile/generate-platform-projects.sh
      - name: Upload generated platform source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-companion-platform-source-${{ github.run_id }}
          path: |
            mobile/apps/store_companion/.metadata
            mobile/apps/store_companion/android
            !mobile/apps/store_companion/android/local.properties
            !mobile/apps/store_companion/android/.gradle/**
            mobile/apps/store_companion/ios
            !mobile/apps/store_companion/ios/Flutter/Generated.xcconfig
            !mobile/apps/store_companion/ios/Flutter/flutter_export_environment.sh
            !mobile/apps/store_companion/ios/Flutter/ephemeral/**
            !mobile/apps/store_companion/ios/.symlinks/**
            mobile/pubspec.lock
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Android development APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-companion-development-debug-${{ github.run_id }}
          path: mobile/apps/store_companion/build/app/outputs/flutter-apk/app-development-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android staging APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-companion-staging-debug-${{ github.run_id }}
          path: mobile/apps/store_companion/build/app/outputs/flutter-apk/app-staging-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android production-identity debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-companion-production-identity-debug-${{ github.run_id }}
          path: mobile/apps/store_companion/build/app/outputs/flutter-apk/app-production-debug.apk
          if-no-files-found: error
          retention-days: 14

  generate-build-and-commit:
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        github.repository == 'rahmatullahboss/store-management-pos' &&
        github.ref == 'refs/heads/module/store-companion-mobile-v1' &&
        github.actor != 'dependabot[bot]'
      }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install exact official Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter_dir="${RUNNER_TEMP}/flutter"
          git clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/flutter/flutter.git \
            "${flutter_dir}"
          git -C "${flutter_dir}" checkout --detach "${FLUTTER_COMMIT}"
          actual_commit="$(git -C "${flutter_dir}" rev-parse HEAD)"
          test "${actual_commit}" = "${FLUTTER_COMMIT}"
          echo "${flutter_dir}/bin" >> "${GITHUB_PATH}"
          "${flutter_dir}/bin/flutter" config --no-analytics
          "${flutter_dir}/bin/flutter" --version
      - name: Generate platform projects and verify Android flavours
        run: bash tooling/mobile/generate-platform-projects.sh
      - name: Verify generated change boundary
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(
            git status --porcelain=v1 --untracked-files=all \
              | sed -E 's/^.. //' \
              | grep -Ev '^mobile/apps/store_companion/(\.metadata$|android/|ios/)|^mobile/pubspec\.lock$' \
              || true
          )"
          if [[ -n "${unexpected}" ]]; then
            echo "Platform generation changed paths outside the reviewed boundary:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
      - name: Commit deterministic platform source
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/module/store-companion-mobile-v1 | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mobile/apps/store_companion/.metadata \
            mobile/apps/store_companion/android \
            mobile/apps/store_companion/ios \
            mobile/pubspec.lock
          if git diff --cached --quiet; then
            echo "Platform projects already match the deterministic generator."
            exit 0
          fi
          git commit -m "feat(mobile): generate Android and iOS platform projects"
          git push origin HEAD:module/store-companion-mobile-v1
      - name: Upload generated platform source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-companion-platform-source-${{ github.run_id }}
          path: |
            mobile/apps/store_companion/.metadata
            mobile/apps/store_companion/android
            !mobile/apps/store_companion/android/local.properties
            !mobile/apps/store_companion/android/.gradle/**
            mobile/apps/store_companion/ios
            !mobile/apps/store_companion/ios/Flutter/Generated.xcconfig
            !mobile/apps/store_companion/ios/Flutter/flutter_export_environment.sh
            !mobile/apps/store_companion/ios/Flutter/ephemeral/**
            !mobile/apps/store_companion/ios/.symlinks/**
            mobile/pubspec.lock
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Android development APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-companion-development-debug-${{ github.run_id }}
          path: mobile/apps/store_companion/build/app/outputs/flutter-apk/app-development-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android staging APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-companion-staging-debug-${{ github.run_id }}
          path: mobile/apps/store_companion/build/app/outputs/flutter-apk/app-staging-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android production-identity debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-companion-production-identity-debug-${{ github.run_id }}
          path: mobile/apps/store_companion/build/app/outputs/flutter-apk/app-production-debug.apk
          if-no-files-found: error
          retention-days: 14
