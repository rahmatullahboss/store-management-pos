name: Release Canary Skeleton

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Non-production target until Foundation Gate passes
        required: true
        default: staging

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: |
          test "${{ inputs.environment }}" != "production"
          echo "Canary release remains non-production until Foundation Gate evidence is complete."
      - run: npm ci --ignore-scripts
      - run: npm run verify
