name: Storefront Publishing Read Wire

on:
  push:
    branches:
      - module/storefront-commerce-v1
    paths:
      - .github/workflows/storefront-publishing-read-wire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: module/storefront-commerce-v1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply exact publishing read wiring
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          service = Path("modules/storefront/src/publishing-read.ts")
          text = service.read_text()
          old_permission = 'requirePermission(context, "storefront.read");'
          if text.count(old_permission) != 7:
              raise SystemExit(f"Expected 7 publishing read permission sites, found {text.count(old_permission)}")
          service.write_text(text.replace(old_permission, 'requirePermission(context, "storefront.storefront.read");'))

          handler = Path("apps/api/src/modules/storefront/read-handler.ts")
          text = handler.read_text()
          import_anchor = 'import { PlatformError } from "../../../../../packages/foundation/src/errors.js";\n'
          import_line = import_anchor + 'import { handleStorefrontPublishingReadRequest } from "./publishing-read-handler.js";\n'
          if text.count(import_anchor) != 1:
              raise SystemExit("Read handler import anchor mismatch")
          text = text.replace(import_anchor, import_line, 1)
          route_anchor = '  if (request.method !== "GET") return null;\n\n  if (url.pathname === "/v1/storefront/storefronts") {'
          route_block = (
              '  if (request.method !== "GET") return null;\n\n'
              '  const publishingResponse = await handleStorefrontPublishingReadRequest(\n'
              '    request,\n'
              '    url,\n'
              '    context,\n'
              '    database,\n'
              '  );\n'
              '  if (publishingResponse) return publishingResponse;\n\n'
              '  if (url.pathname === "/v1/storefront/storefronts") {'
          )
          if text.count(route_anchor) != 1:
              raise SystemExit("Read handler route anchor mismatch")
          handler.write_text(text.replace(route_anchor, route_block, 1))
          PY
          npm ci --ignore-scripts
          npm run format:check
          npm run typecheck
          git config user.name "Storefront Read Bot"
          git config user.email "storefront-read-bot@users.noreply.github.com"
          git add modules/storefront/src/publishing-read.ts apps/api/src/modules/storefront/read-handler.ts
          git commit -m "feat(storefront): wire H2 publishing management reads"
          git push origin HEAD:module/storefront-commerce-v1
