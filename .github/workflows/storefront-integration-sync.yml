name: Storefront Integration Sync

on:
  push:
    branches:
      - module/storefront-commerce-v1
    paths:
      - .github/workflows/storefront-integration-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storefront-integration-sync
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete storefront history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: module/storefront-commerce-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch current integration baseline
        run: git fetch --no-tags origin program/integration-v1
      - name: Attempt merge and persist a non-destructive report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Storefront Integration Bot"
          git config user.email "storefront-integration-bot@users.noreply.github.com"
          feature_head=$(git rev-parse HEAD)
          integration_head=$(git rev-parse origin/program/integration-v1)
          set +e
          git merge --no-commit --no-ff origin/program/integration-v1
          merge_status=$?
          set -e
          mkdir -p docs/architecture/storefront
          report=docs/architecture/storefront/integration-conflicts.txt
          if [ "$merge_status" -eq 0 ]; then
            {
              echo "status=clean"
              echo "feature_head=$feature_head"
              echo "integration_head=$integration_head"
              echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "$report"
            git merge --abort || true
          else
            conflicts=$(git diff --name-only --diff-filter=U | sort)
            index=$(git ls-files -u)
            {
              echo "status=conflicted"
              echo "feature_head=$feature_head"
              echo "integration_head=$integration_head"
              echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "conflict_files_begin"
              printf '%s\n' "$conflicts"
              echo "conflict_files_end"
              echo "unmerged_index_begin"
              printf '%s\n' "$index"
              echo "unmerged_index_end"
            } > /tmp/storefront-integration-conflicts.txt
            git merge --abort || true
            cp /tmp/storefront-integration-conflicts.txt "$report"
          fi
          git add "$report"
          if git diff --cached --quiet; then
            echo "Conflict report is unchanged."
            exit 0
          fi
          git commit -m "chore(storefront): record integration conflicts"
          git push origin HEAD:module/storefront-commerce-v1
