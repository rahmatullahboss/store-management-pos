name: TypeScript 7 Migration

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - apps/api/src/oidc.ts
      - docs/open-source/approvals/typescript-7.0.2.yaml
      - docs/THIRD_PARTY_NOTICES.md
      - .github/workflows/typescript-7-migration.yml

permissions:
  contents: write

concurrency:
  group: typescript-7-migration-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'deps/typescript-7.0.2-migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Regenerate current-workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify compiler and workspace inventory
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          if (lock.packages['node_modules/typescript']?.version !== '7.0.2') process.exit(1);
          if (!lock.packages['apps/marketing-web']) process.exit(1);
          if (lock.packages['node_modules/axe-core']?.version !== '4.12.1') process.exit(1);
          if (lock.packages['node_modules/puppeteer-core']?.version !== '25.4.0') process.exit(1);
          const native = Object.entries(lock.packages).filter(([name]) => name.includes('@typescript/native-preview-'));
          console.log(JSON.stringify({ typescript: lock.packages['node_modules/typescript'], nativePackages: native.map(([name, value]) => ({ name, version: value.version, optional: value.optional })) }, null, 2));
          NODE
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "deps: regenerate lockfile for TypeScript 7.0.2"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Confirm native compiler
        run: |
          npx tsc --version
          node -e "console.log(require('./node_modules/typescript/package.json').version)"
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
