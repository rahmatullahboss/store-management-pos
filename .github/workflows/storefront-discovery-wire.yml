name: Storefront Discovery Wire

on:
  push:
    branches:
      - module/storefront-commerce-v1
    paths:
      - .github/workflows/storefront-discovery-wire.yml

permissions:
  contents: write

concurrency:
  group: storefront-discovery-wire
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: module/storefront-commerce-v1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Wire discovery rendering and migration manifest
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          render = Path("apps/storefront-web/src/render.ts")
          text = render.read_text()
          replacements = [
            (
              '''import type { StorefrontPublicContentBundleV1 } from "../../../packages/storefront-contracts/src/public-content.js";
import {''',
              '''import type { StorefrontPublicContentBundleV1 } from "../../../packages/storefront-contracts/src/public-content.js";
import type {
  StorefrontPublicCategoryPageV1,
  StorefrontPublicCollectionPageV1,
  StorefrontPublicSearchPageV1,
} from "../../../packages/storefront-contracts/src/public-discovery.js";
import {''',
            ),
            (
              '''import { createStorefrontPublicCacheScope } from "./cache-scope.js";
import { formatStorefrontMoneyV1 } from "./money.js";''',
              '''import { createStorefrontPublicCacheScope } from "./cache-scope.js";
import { renderStorefrontDiscovery } from "./discovery-render.js";
import { formatStorefrontMoneyV1 } from "./money.js";''',
            ),
            (
              '''  readonly catalog?: StorefrontPublicCatalogPageV1;
  readonly product?: StorefrontPublicProductDetailV1;
  readonly theme?: unknown;''',
              '''  readonly catalog?: StorefrontPublicCatalogPageV1;
  readonly product?: StorefrontPublicProductDetailV1;
  readonly category?: StorefrontPublicCategoryPageV1;
  readonly collection?: StorefrontPublicCollectionPageV1;
  readonly search?: StorefrontPublicSearchPageV1;
  readonly theme?: unknown;''',
            ),
            (
              '''  const products = options.product
    ? [options.product.product]
    : options.catalog?.items ?? [];
  return products
    .flatMap((product) => [''',
              '''  const products = options.product
    ? [options.product.product]
    : options.catalog?.items ??
      options.category?.items ??
      options.collection?.items ??
      options.search?.items ??
      [];
  const productScope = products
    .flatMap((product) => [''',
            ),
            (
              '''    ])
    .join(":");
}''',
              '''    ])
    .join(":");
  const discovery = renderStorefrontDiscovery(options);
  return `${productScope}:${discovery?.cacheScope ?? "catalog"}`;
}''',
            ),
            (
              '''  const page = content?.page;
  const seo = page?.seo ?? content?.homepageSeo ?? {};
  const titleSource = options.product?.product.summary.name ??
    (options.catalog ? "Products" : undefined) ??''',
              '''  const page = content?.page;
  const seo = page?.seo ?? content?.homepageSeo ?? {};
  const discovery = renderStorefrontDiscovery(options);
  const titleSource = options.product?.product.summary.name ??
    discovery?.title ??
    (options.catalog ? "Products" : undefined) ??''',
            ),
            (
              '''  const descriptionSource = options.product?.product.description ??
    (options.catalog ? `Published product catalog for ${hostname}.` : undefined) ??''',
              '''  const descriptionSource = options.product?.product.description ??
    discovery?.description ??
    (options.catalog ? `Published product catalog for ${hostname}.` : undefined) ??''',
            ),
            (
              '''  const main = options.product && pathname.startsWith("/products/")
    ? renderProductDetail(options.product, context.locale)
    : options.catalog && (pathname === "/products" || pathname === "/products/")''',
              '''  const main = discovery
    ? discovery.html
    : options.product && pathname.startsWith("/products/")
      ? renderProductDetail(options.product, context.locale)
      : options.catalog && (pathname === "/products" || pathname === "/products/")''',
            ),
            (
              '''.tax-note,.sku,.variant-status{margin:0;color:color-mix(in srgb,var(--storefront-foreground) 64%,transparent);font-size:.82rem}.pagination{display:flex;justify-content:center}''',
              '''.tax-note,.sku,.variant-status{margin:0;color:color-mix(in srgb,var(--storefront-foreground) 64%,transparent);font-size:.82rem}.pagination{display:flex;justify-content:center;margin-top:1.5rem}.discovery-children{display:grid;gap:.75rem}.discovery-children h2,.discovery-facets h2{margin:0;font-size:1rem}.discovery-children ul,.discovery-facets ul{display:flex;gap:.65rem;flex-wrap:wrap;list-style:none;margin:0;padding:0}.discovery-children a,.discovery-facets a,.discovery-facets li{display:inline-flex;padding:.5rem .7rem;border:1px solid var(--storefront-border);border-radius:999px;text-decoration:none;background:var(--storefront-surface)}.discovery-layout{display:grid;grid-template-columns:minmax(12rem,18rem) minmax(0,1fr);gap:1.5rem;align-items:start}.discovery-facets{display:grid;gap:1rem;padding:1rem;border:1px solid var(--storefront-border);border-radius:var(--storefront-radius);background:var(--storefront-surface)}.discovery-facets section{display:grid;gap:.65rem}.discovery-facets ul{display:grid}.discovery-facets a:focus-visible,.discovery-children a:focus-visible{outline:3px solid var(--storefront-focus);outline-offset:3px}''',
            ),
            (
              '''    @media (max-width:48rem){.product-detail-grid{grid-template-columns:1fr}.product-detail-copy{position:static}.product-media-large{min-height:18rem}}''',
              '''    @media (max-width:48rem){.product-detail-grid,.discovery-layout{grid-template-columns:1fr}.product-detail-copy{position:static}.product-media-large{min-height:18rem}}''',
            ),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f"Expected one render marker, found {text.count(old)} for {old[:80]!r}")
            text = text.replace(old, new, 1)
          render.write_text(text)

          manifest_path = Path("database/modules/storefront/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          existing = {entry["id"] for entry in manifest["migrations"]}
          for migration_id, file_name in [
            ("STF-0011", "STF-0011-public-category-collection-resolution.sql"),
            ("STF-0012", "STF-0012-public-search-resolution.sql"),
          ]:
            migration_path = Path("database/modules/storefront/migrations") / file_name
            digest = sha256(migration_path.read_bytes()).hexdigest()
            if migration_id in existing:
              for entry in manifest["migrations"]:
                if entry["id"] == migration_id:
                  entry["file"] = file_name
                  entry["sha256"] = digest
            else:
              manifest["migrations"].append({
                "id": migration_id,
                "file": file_name,
                "sha256": digest,
              })
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          tests = Path("tests/unit/storefront-public-content.test.mjs")
          text = tests.read_text()
          replacements = {
            'test("STF-0006 through STF-0010 preserve safe public execution boundaries", async () => {':
              'test("STF-0006 through STF-0012 preserve safe public execution boundaries", async () => {',
            '  assert.equal(manifest.migrations.at(-1).id, "STF-0010");':
              '  assert.equal(manifest.migrations.at(-1).id, "STF-0012");',
          }
          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f"Expected one test marker {old!r}, found {text.count(old)}")
            text = text.replace(old, new, 1)
          tests.write_text(text)
          PY
          npm ci --ignore-scripts
          npm run format:check
          npm run typecheck
          npm run test:unit
          git config user.name "Storefront Discovery Bot"
          git config user.email "storefront-discovery-bot@users.noreply.github.com"
          git add apps/storefront-web/src/render.ts database/modules/storefront/manifest.json tests/unit/storefront-public-content.test.mjs
          git commit -m "feat(storefront): wire discovery rendering and migrations"
          git push origin HEAD:module/storefront-commerce-v1
