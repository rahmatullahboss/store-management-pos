name: MOD-F Neon Rehearsal

on:
  workflow_dispatch:
  push:
    branches:
      - module/localization-compliance-v1
    paths:
      - "database/foundation/**"
      - "database/migrations/catalog/**"
      - "database/migrations/pricing/**"
      - "database/migrations/tax/**"
      - "database/modules/inventory/**"
      - "database/modules/procurement/**"
      - "database/modules/customer/**"
      - "database/modules/sales/**"
      - "database/modules/fulfillment/**"
      - "database/modules/payments/**"
      - "database/modules/accounting/**"
      - "database/modules/banking/**"
      - "database/modules/pos/**"
      - "database/modules/cash/**"
      - "database/modules/localization/**"
      - "tests/integration/mod-f-neon.test.mjs"
      - "tooling/scripts/apply-migrations.mjs"
      - "tooling/scripts/mod-f-neon-rehearsal-ci.mjs"
      - "tooling/scripts/sql-statements.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mod-f-neon-rehearsal.yml"

permissions:
  contents: read

concurrency:
  group: mod-f-neon-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: twilight-boat-26805962
      MOD_F_NEON_BRANCH_ID: br-polished-flower-ax2ph8wp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Build migration tooling
        run: npm run build
      - name: Apply and verify complete chain through MOD-F
        run: node tooling/scripts/mod-f-neon-rehearsal-ci.mjs
      - name: Verify deterministic migration replay
        run: node tooling/scripts/mod-f-neon-rehearsal-ci.mjs
      - name: Upload MOD-F Neon evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-f-neon-rehearsal-${{ github.run_id }}
          path: artifacts/mod-f/neon-rehearsal.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record rehearsal summary
        if: always()
        run: |
          echo "### MOD-F Neon rehearsal" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`dev/module-localization-compliance\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch ID: \`br-polished-flower-ax2ph8wp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full migration chain through MOD-F: executed twice and verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Localization tenant isolation, replay, fiscal state and direct-write denial: checked" >> "$GITHUB_STEP_SUMMARY"
