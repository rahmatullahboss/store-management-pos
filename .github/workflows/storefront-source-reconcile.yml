name: Storefront Source Reconcile

on:
  push:
    branches:
      - module/storefront-commerce-v1
    paths:
      - .github/workflows/storefront-source-reconcile.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: module/storefront-commerce-v1
      - name: Apply exact type-only replacement
        shell: python
        run: |
          from pathlib import Path
          path = Path("modules/storefront/src/index.ts")
          content = path.read_text()
          old = "  entityId = crypto.randomUUID(),\n"
          new = "  entityId: string = crypto.randomUUID(),\n"
          if content.count(old) != 1:
              raise SystemExit(f"expected one replacement, found {content.count(old)}")
          path.write_text(content.replace(old, new))
      - name: Commit reconciled source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/storefront/src/index.ts
          git commit -m "fix(storefront): widen validated UUID parameter type"
          git push origin HEAD:module/storefront-commerce-v1
