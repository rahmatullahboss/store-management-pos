name: Storefront Publishing Type Fix

on:
  push:
    branches:
      - module/storefront-commerce-v1
    paths:
      - .github/workflows/storefront-publishing-typefix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: module/storefront-commerce-v1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply exact type-only patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path("modules/storefront/src/publishing.ts")
          text = path.read_text()
          old = "  entityId = crypto.randomUUID(),\n"
          new = "  entityId: string = crypto.randomUUID(),\n"
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one publishing entityId inference site")
          path.write_text(text.replace(old, new, 1))
          PY
          npm ci --ignore-scripts
          npm run typecheck
          git config user.name "Storefront Type Bot"
          git config user.email "storefront-type-bot@users.noreply.github.com"
          git add modules/storefront/src/publishing.ts
          git commit -m "fix(storefront): widen publishing entity identifier type"
          git push origin HEAD:module/storefront-commerce-v1
