name: Marketing Pages Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
    branches:
      - main
    paths:
      - "apps/marketing-web/**"
      - "docs/architecture/marketing/**"
      - "tests/architecture/marketing-landing.test.mjs"
      - "tooling/scripts/marketing-design-evidence.mjs"
      - ".github/workflows/marketing-pages-deploy.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "apps/marketing-web/**"
      - "docs/architecture/marketing/**"
      - "tests/architecture/marketing-landing.test.mjs"
      - "tooling/scripts/marketing-design-evidence.mjs"
      - ".github/workflows/marketing-pages-deploy.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify landing page
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify repository
        run: npm run verify

      - name: Verify marketing browser and accessibility evidence
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run design:marketing-evidence

  preview:
    name: Deploy Cloudflare Pages preview
    needs: verify
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Deploy preview only
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          preCommands: |
            npx wrangler pages project list --json | grep -Eq '"(Project Name|name)"[[:space:]]*:[[:space:]]*"store-operating-system"' || npx wrangler pages project create store-operating-system --production-branch=main
          command: pages deploy apps/marketing-web/src --project-name=store-operating-system --branch=${{ github.event.pull_request.head.ref || 'manual-preview' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish preview links
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "## Cloudflare Pages preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch alias: ${ALIAS_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production publishing remains disabled pending launch approvals." >> "$GITHUB_STEP_SUMMARY"
