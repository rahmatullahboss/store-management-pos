name: Marketing Pages Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/marketing-web/**"
      - "tests/architecture/marketing-landing.test.mjs"
      - "tooling/scripts/marketing-design-evidence.mjs"
      - ".github/workflows/marketing-pages-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "apps/marketing-web/**"
      - "tests/architecture/marketing-landing.test.mjs"
      - "tooling/scripts/marketing-design-evidence.mjs"
      - ".github/workflows/marketing-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: marketing-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify landing page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

      - name: Verify Impeccable design rules
        run: npm run design:detect

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy landing page
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          command: pages deploy apps/marketing-web/src --project-name=store-operating-system --branch=${{ github.event.pull_request.head.ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish deployment links
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "## Cloudflare Pages deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch alias: ${ALIAS_URL}" >> "$GITHUB_STEP_SUMMARY"
