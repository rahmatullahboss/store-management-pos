name: Storefront Rehearsal Fixture Wire

on:
  push:
    branches:
      - module/storefront-commerce-v1
    paths:
      - .github/workflows/storefront-rehearsal-fixture-wire.yml

permissions:
  contents: write

concurrency:
  group: storefront-rehearsal-fixture-wire
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: module/storefront-commerce-v1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply exact command receipt schema correction
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path("tests/integration/storefront-publishing-postgres-rehearsal.sql")
          text = path.read_text()
          old = "    AND command_scope IN ("
          new = "    AND command_type IN ("
          if text.count(old) != 1:
              raise SystemExit(f"Expected one stale command_scope reference, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          npm ci --ignore-scripts
          npm run format:check
          npm run typecheck
          npm run test:unit
          git config user.name "Storefront Rehearsal Bot"
          git config user.email "storefront-rehearsal-bot@users.noreply.github.com"
          git add tests/integration/storefront-publishing-postgres-rehearsal.sql
          git commit -m "fix(storefront): align receipt rehearsal schema"
          git push origin HEAD:module/storefront-commerce-v1
