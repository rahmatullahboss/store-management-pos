name: Storefront Format Fix

on:
  push:
    branches:
      - module/storefront-commerce-v1
    paths:
      - .github/workflows/storefront-format-fix.yml

permissions:
  contents: write

concurrency:
  group: storefront-format-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: module/storefront-commerce-v1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Restore final newline and verify
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path("apps/api/src/index.ts")
          data = path.read_bytes()
          if not data.endswith(b"\n"):
              path.write_bytes(data + b"\n")
          PY
          npm ci --ignore-scripts
          npm run format:check
          npm run typecheck
          git config user.name "Storefront Format Bot"
          git config user.email "storefront-format-bot@users.noreply.github.com"
          git add apps/api/src/index.ts
          if git diff --cached --quiet; then
            echo "API index already has canonical formatting."
            exit 0
          fi
          git commit -m "style(storefront): restore API newline"
          git push origin HEAD:module/storefront-commerce-v1
