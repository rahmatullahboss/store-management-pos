name: Storefront PostgreSQL Truth Fix

on:
  push:
    branches:
      - module/storefront-commerce-v1
    paths:
      - .github/workflows/storefront-postgres-truth-fix.yml

permissions:
  contents: write

concurrency:
  group: storefront-postgres-truth-fix
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: storefront_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d storefront_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/storefront_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: module/storefront-commerce-v1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply narrow fixture and CI truth corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          publishing = Path("tests/integration/storefront-publishing-postgres-rehearsal.sql")
          text = publishing.read_text()
          old = "    NULL, 'shirts', 10, 'published', NULL,"
          new = "    NULL, 'publishing-shirts', 10, 'published', NULL,"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one publishing slug marker, found {text.count(old)}")
          publishing.write_text(text.replace(old, new, 1))

          workflow = Path(".github/workflows/storefront-ci.yml")
          text = workflow.read_text()
          old = "      - name: Run storefront PostgreSQL migration and command rehearsal\n        run: |\n          mkdir -p artifacts/storefront"
          new = "      - name: Run storefront PostgreSQL migration and command rehearsal\n        run: |\n          set -o pipefail\n          mkdir -p artifacts/storefront"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one PostgreSQL workflow marker, found {text.count(old)}")
          workflow.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/storefront-postgres-truth-fix.yml
      - name: Install and verify exact source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          npm ci --ignore-scripts
          npm run format:check
          npm run typecheck
          npm run test:unit
          npm run db:validate
          npm run storefront:db:rehearsal
      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Storefront PostgreSQL Bot"
          git config user.email "storefront-postgres-bot@users.noreply.github.com"
          git add .github/workflows/storefront-ci.yml tests/integration/storefront-publishing-postgres-rehearsal.sql .github/workflows/storefront-postgres-truth-fix.yml
          git commit -m "fix(storefront): isolate discovery fixtures and enforce pipefail"
          git push origin HEAD:module/storefront-commerce-v1
