name: Storefront Catalog Contrast Fix

on:
  push:
    branches:
      - module/storefront-commerce-v1
    paths:
      - .github/workflows/storefront-catalog-contrast-fix.yml

permissions:
  contents: write

concurrency:
  group: storefront-catalog-contrast-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: module/storefront-commerce-v1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Raise compare-at price contrast
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path("apps/storefront-web/src/render.ts")
          text = path.read_text()
          old = ".price del{color:color-mix(in srgb,var(--storefront-foreground) 55%,transparent)}"
          new = ".price del{color:color-mix(in srgb,var(--storefront-foreground) 72%,transparent)}"
          if text.count(old) != 1:
            raise SystemExit(f"Expected one compare-at price style, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          npm ci --ignore-scripts
          npm run format:check
          npm run typecheck
          npm run test:unit
          npm run storefront:catalog:design:evidence
          git config user.name "Storefront Catalog Bot"
          git config user.email "storefront-catalog-bot@users.noreply.github.com"
          git add apps/storefront-web/src/render.ts
          git commit -m "fix(storefront): improve compare-at price contrast"
          git push origin HEAD:module/storefront-commerce-v1
