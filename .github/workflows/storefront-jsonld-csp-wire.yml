name: Storefront JSON-LD CSP Integration

on:
  pull_request:
    branches:
      - program/integration-v1
    paths:
      - .github/workflows/storefront-jsonld-csp-wire.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: module/storefront-commerce-v1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Wire deterministic structured-data CSP
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("apps/storefront-web/src/render.ts")
          text = path.read_text()
          replacements = [
            (
              'import { formatStorefrontMoneyV1 } from "./money.js";\n',
              'import { formatStorefrontMoneyV1 } from "./money.js";\nimport {\n  renderStorefrontProductStructuredData,\n  serializeStorefrontProductStructuredData,\n} from "./seo.js";\n'
            ),
            (
              '''async function cacheEtag(scope: string): Promise<string> {
  const digest = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(scope),
  );
  const prefix = Array.from(new Uint8Array(digest).slice(0, 16), (byte) =>
    byte.toString(16).padStart(2, "0"),
  ).join("");
  return `W/\\"${prefix}\\"`;
}
''',
              '''async function cacheEtag(scope: string): Promise<string> {
  const digest = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(scope),
  );
  const prefix = Array.from(new Uint8Array(digest).slice(0, 16), (byte) =>
    byte.toString(16).padStart(2, "0"),
  ).join("");
  return `W/\\"${prefix}\\"`;
}

async function sha256Base64(value: string): Promise<string> {
  const digest = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(value),
  );
  let binary = "";
  for (const byte of new Uint8Array(digest)) {
    binary += String.fromCharCode(byte);
  }
  return btoa(binary);
}
'''
            ),
            (
              '''function renderDocument(
  request: Request,
  bootstrap: StorefrontBootstrapV1,
  options: StorefrontShellRenderOptions,
): string {''',
              '''function renderDocument(
  request: Request,
  bootstrap: StorefrontBootstrapV1,
  options: StorefrontShellRenderOptions,
  structuredData: string | null,
): string {'''
            ),
            (
              '''  const discovery = renderStorefrontDiscovery(options);
  const titleSource = discovery?.title ??''',
              '''  const discovery = renderStorefrontDiscovery(options);
  const robots = options.search ? "noindex,follow" : "index,follow";
  const structuredDataMarkup = structuredData ? `\\n  ${structuredData}` : "";
  const titleSource = discovery?.title ??'''
            ),
            (
              '  <meta name="robots" content="noindex,follow">',
              '  <meta name="robots" content="${robots}">'
            ),
            (
              '  <title>${title}</title>\n  <style>',
              '  <title>${title}</title>${structuredDataMarkup}\n  <style>'
            ),
            (
              '''  const cacheScope = createStorefrontPublicCacheScope(
    bootstrap.context,
    options.buildId,
  );
  const headers = new Headers({''',
              '''  const cacheScope = createStorefrontPublicCacheScope(
    bootstrap.context,
    options.buildId,
  );
  const structuredDataJson = options.product
    ? serializeStorefrontProductStructuredData(options.product)
    : null;
  const structuredData = options.product
    ? renderStorefrontProductStructuredData(options.product)
    : null;
  const scriptSource = structuredDataJson
    ? `'sha256-${await sha256Base64(structuredDataJson)}'`
    : "'none'";
  const headers = new Headers({'''
            ),
            (
              '''    "Content-Security-Policy":
      "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src 'none'; style-src 'unsafe-inline'",''',
              '''    "Content-Security-Policy":
      `default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; object-src 'none'; script-src ${scriptSource}; style-src 'unsafe-inline'`,'''
            ),
            (
              '''  const body = options.headOnly
    ? null
    : renderDocument(request, bootstrap, options);''',
              '''  const body = options.headOnly
    ? null
    : renderDocument(request, bootstrap, options, structuredData);'''
            ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Render patch expected one marker, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify exact integration
        run: |
          npm ci --ignore-scripts
          npm run format:check
          npm run typecheck
          npm run test:unit
          npm run build
          npm run storefront:astro:build
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Storefront SEO Bot"
          git config user.email "storefront-seo-bot@users.noreply.github.com"
          git add apps/storefront-web/src/render.ts
          git commit -m "feat(storefront): bind product JSON-LD to CSP"
          git push origin HEAD:module/storefront-commerce-v1
